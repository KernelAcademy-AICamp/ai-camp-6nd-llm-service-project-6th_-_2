[project]
name = "banttang-api"
version = "0.1.0"
description = "반띵 FastAPI 보조 서버 — OCR, 알림톡, 결제 콜백, 크롤링"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "supabase>=2.7.0",
  "redis>=5.0.7",
  "anthropic>=0.40.0",
  "apscheduler>=3.10.4",
  "python-multipart>=0.0.9",
  "sentry-sdk[fastapi]>=2.10.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5.0",
  "mypy>=1.10.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "pytest-httpx>=0.30.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
