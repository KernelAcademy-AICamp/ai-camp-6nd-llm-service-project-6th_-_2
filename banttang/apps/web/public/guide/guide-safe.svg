<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="영수증 인증으로 안전하게 거래해요">
  <defs>
    <linearGradient id="safe-heart" x1="40" y1="40" x2="160" y2="190" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A6CE8E"/>
      <stop offset="0.55" stop-color="#7FB069"/>
      <stop offset="1" stop-color="#5E8A4C"/>
    </linearGradient>
    <filter id="safe-receipt-shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#4F7A3E" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- 하트 -->
  <g transform="translate(15,40) scale(1.7)">
    <path
      d="M50 88 C10 60 0 35 0 22 C0 8 12 0 25 0 C38 0 47 10 50 18 C53 10 62 0 75 0 C88 0 100 8 100 22 C100 35 90 60 50 88 Z"
      fill="url(#safe-heart)"/>
    <!-- 하이라이트 -->
    <path d="M22 8 C14 8 8 14 8 22 C8 27 10 33 15 40" stroke="#C8E3B4" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- 영수증 -->
  <g filter="url(#safe-receipt-shadow)">
    <path
      d="M61 148 L61 70 Q61 58 73 58 L127 58 Q139 58 139 70 L139 148
         L131.2 156 L123.4 148 L115.6 156 L107.8 148 L100 156 L92.2 148 L84.4 156 L76.6 148 L68.8 156 L61 148 Z"
      fill="#FBFAF6"/>
    <!-- 상단 살짝 접힌 띠 -->
    <path d="M61 70 L61 66 Q61 58 73 58 L127 58 Q139 58 139 66 L139 70 Z" fill="#F1ECE2"/>
  </g>

  <!-- 제목 줄 -->
  <rect x="82" y="72" width="36" height="6" rx="3" fill="#C9C2B6"/>

  <!-- 본문 줄 (좌: 항목 / 우: 금액) -->
  <rect x="71" y="88"  width="40" height="4.5" rx="2.25" fill="#D9D3C8"/>
  <rect x="118" y="88" width="14" height="4.5" rx="2.25" fill="#D9D3C8"/>
  <rect x="71" y="98"  width="34" height="4.5" rx="2.25" fill="#D9D3C8"/>
  <rect x="118" y="98" width="13" height="4.5" rx="2.25" fill="#D9D3C8"/>

  <!-- 점선 구분 -->
  <line x1="71" y1="112" x2="131" y2="112" stroke="#CFC8BC" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="0.4 5"/>

  <!-- 합계 줄 + ₩ -->
  <rect x="71" y="124" width="30" height="5" rx="2.5" fill="#CFC8BC"/>
  <g transform="translate(116,121)" stroke="#A8A299" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M0 0 L4 13 L8 2.5 L12 13 L16 0"/>
    <line x1="0.5" y1="5" x2="15.5" y2="5"/>
    <line x1="0.5" y1="9" x2="15.5" y2="9"/>
  </g>
</svg>
