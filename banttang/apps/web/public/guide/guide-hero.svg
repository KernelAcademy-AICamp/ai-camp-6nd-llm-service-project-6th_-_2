  <g>
    <!-- 식료품 -->
    <circle cx="232" cy="244" r="8" fill="#E5634E"/>
    <circle cx="248" cy="242" r="9" fill="#EE9A52"/>
    <circle cx="240" cy="236" r="7" fill="#8FBF6A"/>
    <rect x="252" y="226" width="8" height="22" rx="3" fill="#BFE3F0"/>
    <path d="M222 248 h44 l-4 26 a6 6 0 0 1 -6 5 h-24 a6 6 0 0 1 -6 -5 Z" fill="url(#gh-basket)"/>
