<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>띵동 — 메인 상단</title>
  <style>
    :root {
      --green: #6fb04f;          /* 띵동 로고/브랜드 그린 */
      --ink: #1a1a1a;            /* 진한 텍스트/CTA */
      --gray: #8a8f98;           /* 보조 텍스트 */
      --price: #ec3a5d;          /* 가격 강조 핑크/레드 */
      --banner-1: #ffe4ea;       /* 배너 그라데이션 시작 */
      --banner-2: #ffd2c4;       /* 배너 그라데이션 끝(살구톤) */
      --line: #ededf0;           /* 옅은 보더 */
      --bg: #f3f4f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
        system-ui, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    /* 모바일 폭 기준(390~430px) 가운데 정렬 컨테이너 */
    .app {
      max-width: 430px;
      min-height: 100vh;
      margin: 0 auto;
      background: #fff;
    }

    /* ── 1. 헤더 ───────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
    }
    .logo {
      font-size: 20px;
      font-weight: 800;
      color: var(--green);
      letter-spacing: -0.02em;
      flex-shrink: 0;
    }
    .location {
      display: flex;
      align-items: center;
      gap: 3px;
      min-width: 0;            /* truncate 허용 */
      flex: 1;
      color: #4b4f57;
      font-size: 12px;
    }
    .location .addr {
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }
    .location svg { flex-shrink: 0; color: var(--price); }

    .header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .nickname { font-size: 13px; font-weight: 700; color: #2a2d33; }
    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      color: #4b4f57;
      background: none;
      border: 0;
      cursor: pointer;
    }

    /* ── 2. 메인 배너 ──────────────────────── */
    .section { padding: 0 16px; }

    .banner {
      position: relative;
      overflow: hidden;
      border-radius: 12px;
      background: var(--banner-1);   /* 이미지 로드 전 fallback */
      padding: 18px 18px 20px;
      min-height: 176px;
    }
    /* 배너 전체를 채우는 사진 (교체 가능) */
    .banner-img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: right center;
      z-index: 0;
      pointer-events: none;
      user-select: none;
    }
    /* 좌측 텍스트 가독성용 그라데이션 스크림 */
    .banner-scrim {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: linear-gradient(
        100deg,
        rgba(252, 224, 231, 0.95) 0%,
        rgba(252, 224, 231, 0.7) 36%,
        rgba(252, 224, 231, 0) 62%
      );
    }
    .banner-text {
      position: relative;
      z-index: 2;
      max-width: 60%;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(255, 255, 255, 0.7);
      color: #b4424f;
      font-size: 12px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 999px;
    }
    .banner-title {
      margin-top: 12px;
      font-size: 24px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.02em;
      color: #1a1a1a;
    }
    .banner-price {
      margin-top: 4px;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--price);
    }

    .cta-row {
      position: relative;
      z-index: 2;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 16px;
    }
    .cta {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--ink);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      padding: 10px 18px;
      border: 0;
      border-radius: 999px;
      cursor: pointer;
    }
    .cta-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 26px;
      height: 26px;
      color: #6b7280;
    }

    /* 페이지 인디케이터 pill */
    .indicator {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 3;
      display: inline-flex;
      align-items: center;
      gap: 3px;
      background: rgba(0, 0, 0, 0.5);
      color: #fff;
      font-size: 11px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
    }
    .indicator b { font-weight: 800; }

    /* ── 3. 검색창 ─────────────────────────── */
    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      padding: 12px 14px;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 12px;
    }
    .search svg { flex-shrink: 0; color: #9aa0a8; }
    .search input {
      flex: 1;
      border: 0;
      outline: 0;
      font: inherit;
      font-size: 14px;
      color: #2a2d33;
      background: transparent;
    }
    .search input::placeholder { color: #b3b8c0; }
  </style>
</head>
<body>
  <div class="app">
    <!-- 1. 헤더 -->
    <header class="header">
      <span class="logo">띵동</span>
      <div class="location">
        <!-- 위치 핀 -->
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M12 21s7-6.2 7-11a7 7 0 1 0-14 0c0 4.8 7 11 7 11Z"
            stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
          <circle cx="12" cy="10" r="2.4" stroke="currentColor" stroke-width="2" />
        </svg>
        <span class="addr">서울특별시 서초구 강남대로49길 10</span>
      </div>
      <div class="header-right">
        <span class="nickname">냉냥이</span>
        <button class="icon-btn" aria-label="알림">
          <!-- 알림 벨 -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <path d="M18 8.5a6 6 0 1 0-12 0c0 6.5-2.5 8-2.5 8h17S18 15 18 8.5Z"
              stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
            <path d="M10.3 20.5a2 2 0 0 0 3.4 0" stroke="currentColor"
              stroke-width="1.8" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </header>

    <!-- 2. 메인 배너 -->
    <div class="section">
      <section class="banner">
        <!-- 배너 전체를 채우는 복숭아 사진 (교체 가능) -->
        <img class="banner-img" src="/images/peach.png" alt="노지 신비복숭아" />
        <div class="banner-scrim"></div>

        <div class="banner-text">
          <span class="badge">🍑 띵동 단독 공구</span>
          <h2 class="banner-title">노지 신비복숭아</h2>
          <p class="banner-price">공구가 21,900원~</p>
        </div>

        <div class="cta-row">
          <button class="cta">공구 참여하기</button>
          <span class="cta-icon" aria-hidden="true">
            <!-- 다운로드/받기 아이콘 -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path d="M12 4v10m0 0 4-4m-4 4-4-4" stroke="currentColor"
                stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M5 18h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
          </span>
        </div>

        <div class="indicator"><b>1</b> / 4 <span>+</span></div>
      </section>

      <!-- 3. 검색창 -->
      <div class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2" />
          <path d="m20 20-3.2-3.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
        <input type="text" placeholder="배달·장보기 통합 검색 (가게명 또는 메뉴)" />
      </div>
    </div>
  </div>
</body>
</html>
