# Supabase 로컬 개발 설정. `supabase init` 산출물의 기본값을 그대로 두되 PostGIS만 활성화.
# 자세한 옵션: https://supabase.com/docs/guides/cli/config

project_id = "banttang"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329

[realtime]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_signup = true

[auth.external.kakao]
enabled = true
client_id = "env(KAKAO_REST_API_KEY)"
secret = "env(KAKAO_CLIENT_SECRET)"
redirect_uri = ""

[analytics]
enabled = false

[functions]
verify_jwt = true
